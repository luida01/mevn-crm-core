name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            frontend-admin/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Install shop dependencies
        run: npm ci --prefix frontend
      - name: Install admin dependencies
        run: npm ci --prefix frontend-admin

      - name: Build backend
        run: npm run build --prefix backend
      - name: Build shop
        run: npm run build --prefix frontend
      - name: Build admin
        run: npm run build --prefix frontend-admin

      - name: Run isolated API workflows
        run: npm run check:workflows --prefix backend
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017

      - name: Verify stock alerts with isolated SMTP and database
        run: npm run check:stock-alerts --prefix backend
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run catalog, mixed cart, and admin browser flows
        run: npm run test:e2e --prefix frontend
        env:
          CI: true
          E2E_MONGODB_URI: mongodb://127.0.0.1:27017/mangago_e2e
          ADMIN_USERNAME: e2e-admin
          ADMIN_PASSWORD: e2e-password-only-for-tests

      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
